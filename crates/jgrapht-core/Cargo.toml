[package]
name = "jgrapht-core"
description = "A Rust port of the JGraphT core library, built around graph traits"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "jgrapht"

[dependencies]
rheaps = "0.16.2"
indexmap = "2"
thiserror = "2"
rand = "0.9"
num-bigint = "0.4"
num-rational = "0.4.2"
num-traits = "0.2.19"
