[package]
name = "jgrapht"
description = "A Rust port of the JGraphT core library, built around graph traits"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rheaps = "0.16.2"
indexmap = "2"
thiserror = "2"
rand = "0.9"
dashu-float = "0.6.2"
dashu-int = "0.6.2"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "graph_perf"
harness = false

[[bench]]
name = "shortestpath_perf"
harness = false
