name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 3 * * 0"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [stable, "1.88"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace

  ignored-tests:
    # The slow upstream cases (ISSUES I-5); weekly only.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --release -- --ignored

  bench-gate:
    # Runs the benchmarks of the base branch and of the pull request on the same runner and fails
    # when one is more than 30% slower. Shared runners are noisy, so the threshold is generous and
    # the benchmarks use few samples; see scripts/bench_gate.py.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Benchmarks of the base branch
        run: |
          git worktree add ../base "origin/${{ github.base_ref }}"
          (cd ../base && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo bench -p jgrapht --benches -- --save-baseline base)
      - name: Benchmarks of the pull request
        run: cargo bench -p jgrapht --benches -- --save-baseline head
      - name: Compare
        run: python3 scripts/bench_gate.py base head --threshold 1.30

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  api-audit:
    # Reporting-only until roadmap item R4 completes; then add `--strict`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/api_audit.py unwraps
      - run: python3 scripts/api_audit.py inventory && git diff --exit-code docs/API_INVENTORY.md

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo package -p jgrapht --locked
      # jgrapht-io can be packaged only after its jgrapht version is on crates.io. Until then,
      # audit the manifest and published file set without resolving registry dependencies.
      - run: cargo package -p jgrapht-io --list
