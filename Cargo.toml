[workspace]
resolver = "3"
members = ["crates/jgrapht", "crates/jgrapht-io"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
license = "EPL-2.0 OR LGPL-2.1-or-later"
authors = ["JGraphT Contributors", "jgrapht-rs Contributors"]
repository = "https://github.com/d-michail/jgrapht-rs"
readme = "README.md"
keywords = ["graph", "algorithms", "network", "jgrapht"]
categories = ["algorithms", "data-structures"]

[profile.dev]
opt-level = 2
